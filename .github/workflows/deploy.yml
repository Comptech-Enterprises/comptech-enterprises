name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (pull latest & rebuild container)
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          echo "==> Updating source in ~/website"
          cd ~/website
          git fetch --all --prune
          git reset --hard origin/main
          git log --oneline -1

          echo "==> Rebuilding & restarting container"
          cd ~
          docker compose up -d --build

          echo "==> Pruning dangling images & build cache"
          docker image prune -f >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          EOF

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          echo "==> Waiting for app on :3000"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK - HTTP 200 after ${i} attempt(s)"
              docker compose -f ~/docker-compose.yml ps || true
              exit 0
            fi
            echo "attempt $i: HTTP $code — retrying in 3s"
            sleep 3
          done
          echo "Health check failed: app did not return HTTP 200"
          docker compose -f ~/docker-compose.yml logs --tail=50 web || true
          exit 1
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
